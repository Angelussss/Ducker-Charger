# =====================================================================
# Ducker-Charger UI sim — fake data
# change numbers, run ./sim_ui again (reads this file from cwd,
# or give path: ./sim_ui other_file.ini)
# "ripple" = wiggle size in mA (0 = number stay still)
# =====================================================================

# ---- battery ----
soc         = 73        # charge %
pack_mv     = 12420     # pack voltage, mV
batt_ma     = 2150      # base current: >0 charging, <0 draining
batt_ripple = 2200      # 0 = flat current, no sine
temp_c      = 31
vbus        = 1         # 1 = USB-C charger plugged in
full        = 0         # 1 = battery full (check icon)
phase       = 2         # charger: 0=IDLE 1=PRE 2=FAST 3=TAPER

# ---- ports (0/1, mV, mA, ripple mA) ----
a1_active  = 1
a1_mv      = 5000
a1_ma      = 1800
a1_ripple  = 350

a2_active  = 0
a2_mv      = 5000
a2_ma      = 0
a2_ripple  = 0

c1_active  = 1         # USB-C1 in OTG mode (gives power out)
c1_mv      = 5000
c1_ma      = 900
c1_ripple  = 200

c2_active  = 1
c2_mv      = 12000
c2_ma      = 2500
c2_ripple  = 500

lab_active = 0
lab_mv     = 5000
lab_ma     = 0
lab_ripple = 0

# ---- statistics (OVERALL DATA screen) ----
cycles          = 87
health          = 94      # state of health %
cap_full_mah    = 8460
cap_design_mah  = 9000
charges         = 3
max_temp_c      = 42
max_out_ma      = 3120
max_in_ma       = 4460
energy_mwh      = 18540
uptime_s        = 5315

# ---- single parallel-group voltages (0 or missing = pack_mv/4) ----
#cell1_mv = 3860
#cell2_mv = 3855
#cell3_mv = 3210
#cell4_mv = 3840

# ---- runtime guesses (minutes; MAIN shows them under SoC) ----
tte_min = 158    # time-to-empty (when draining)
ttf_min = 72     # time-to-full (when charging)
