# Ducker-Charger PCB emulator — board & scenario configuration
# Read at startup; edit and relaunch, no rebuild needed.

# battery
soc = 65                # initial state of charge, %
soh = 97                # state of health, %
cycles = 42
ambient_c = 25
time_scale = 60         # battery time acceleration (60 = 1 min -> 1 h)
quiescent_ma = 30       # board idle draw from the pack

# C1 charger (TPS25750 side) PD contract offered when plugged
charge_ma = 3000        # CC charge current into the pack
c1_mv = 20000
c1_ma = 3000

# C1 as source (key 'd': sink device attached, powerbank powers it)
# 20 V / 3 A: BQ25713 OTG boost reaches ~20.8 V max, so a 20 V PDO is
# the top of what the real hardware can advertise
c1src_mv = 20000
c1src_ma = 3000

# C2 sink (CYPD3175 side) contract requested when a device attaches
c2_mv = 15000
c2_ma = 3000

# USB-A loads (drawn when attached with key 1 / 2 and port enabled)
a1_load_ma = 3000
a2_load_ma = 3000

# IC behavior
tps_app_mode = 0        # 0 = boot in PTCH mode (exercise the patch flow)
tps_strict_len = 1      # 1 = faithful TPS25750 length-prefixed protocol
                        # 0 = tolerate charge.c's unprefixed Mem_Read/Write
gauge_provisioned = 0   # 0 = blank data flash (exercise provisioning.c)
bckl_active_low = 0     # JP402 jumper: 1 = PMOS (faithful to ili9341.c —
                        # screen goes DARK when the FSM hits IDLE, finding #6)
                        # 0 = NMOS: fsm.c polarity works, UI visible
